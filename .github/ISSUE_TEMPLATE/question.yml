name: Question
description: You need help to build something with gridcn.
title: "[question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Read the [docs](https://gridcn.vercel.app/docs) and the [recipes](https://gridcn.vercel.app/docs/recipes) first. Many tasks have a worked example there.
        If you found a bug, use the bug report template instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the docs and the existing issues.
          required: true
  - type: textarea
    id: goal
    attributes:
      label: What you want to build
      description: Describe the result you want, as the person who uses the grid sees it.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Show the code you have and what happens. Remove everything that does not matter.
    validations:
      required: true
  - type: input
    id: items
    attributes:
      label: gridcn items and version
      placeholder: data-grid, data-grid-io, 1.0.0
