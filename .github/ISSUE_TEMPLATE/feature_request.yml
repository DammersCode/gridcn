name: Feature request
description: Suggest a capability gridcn does not have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you try to do and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How it should work, ideally with a small code sample of the call site.
    validations:
      required: true
  - type: input
    id: items
    attributes:
      label: Related gridcn items
      placeholder: data-grid, data-grid-io
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
