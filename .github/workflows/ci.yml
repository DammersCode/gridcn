name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned: ubuntu-latest rolls to 26.04 automatically (GitHub migration, from 2026-10-19); test 26.04 here before switching.
jobs:
  checks:
    name: Checks (typecheck, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PR runs gate on author (fork PRs skip, 0 min); to check an outside PR, Actions -> Run workflow on its branch.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm types:check

      # Consumers run TypeScript 5.9, which infers some types differently from TypeScript 7.
      - name: Typecheck (TypeScript 5.9 consumer baseline)
        run: pnpm types:check:ts5

      - name: Lint (oxlint + import boundaries)
        run: pnpm lint

      - name: Typed lint (type-checked no-unsafe on registry source)
        run: pnpm lint:typed

      # About 30 s, so it runs here and not in pnpm lint.
      - name: Docs checks (links, code samples, props, symbols, demos, structure)
        run: pnpm docs:verify

  unit:
    name: Unit + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit + coverage (pure-lib branch thresholds enforced)
        run: npx vitest run registry tests --exclude "**/*.browser.test.*" --project unit --project conformance --coverage

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Only this job saves the cache, so the two browser jobs never race to save one key.
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Browser tests
        run: npx vitest run --project browser

  unit-compiled:
    name: Unit + React Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same suite with the React Compiler wired in; the guard tests fail if it is not.
      - name: Unit tests with the React Compiler
        run: npx vitest run --project unit-compiled

  browser-compiled:
    name: Browser + React Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Same suite with the React Compiler wired in; the guard tests fail if it is not.
      - name: Browser tests with the React Compiler
        run: npx vitest run --project browser-compiled

  build:
    name: Build + registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Before the rebuild — a rebuild would mask a committed payload that was never regenerated.
      - name: Verify payload content matches source
        run: node scripts/verify-payload-content.mjs

      - name: Registry build
        run: pnpm registry:build

      - name: Verify registry (no drift between registry.json and disk)
        run: node scripts/verify-registry.mjs

      - name: Verify demo install closure (dependencies and payload imports resolve)
        run: node scripts/verify-demo-install.mjs

      # Validates the GitHub registry (registry.json at repo root) exactly as the shadcn CLI
      # resolves it. GITHUB_TOKEN can read the repo that owns the workflow (per-shadcn-docs
      # limitation for other repos); the full commit SHA skips ref resolution via git.
      - name: Validate GitHub registry (shadcn CLI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx shadcn@4.21.0 registry validate DammersCode/gridcn#${{ github.sha }}

  postgrest:
    name: PostgREST (Supabase adapter)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["DammersCode"]'), github.event.pull_request.user.login)
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the grid function and the fixture schema
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG" psql -v ON_ERROR_STOP=1 -U postgres -c "create role anon nologin; create role authenticated nologin;"
          docker exec -i "$PG" psql -v ON_ERROR_STOP=1 -U postgres < registry/default/blocks/data-grid-server-query-supabase/grid-query.sql
          docker exec -i "$PG" psql -v ON_ERROR_STOP=1 -U postgres < tests/server-query-postgrest/fixture.sql

      # The JWT secret exists only for this run, so no secret is committed.
      - name: Start PostgREST
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "POSTGREST_JWT_SECRET=$secret" >> "$GITHUB_ENV"
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://postgres@localhost:5432/postgres \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$secret" \
            -e PGRST_DB_MAX_ROWS=1000 \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_ADMIN_SERVER_PORT=3001 \
            postgrest/postgrest:v16.6@sha256:5ce030c153500fe90ba157da4da8ba99ab51d3bc7b95e071bd0b544b67a632f7
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3001/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs postgrest
          exit 1

      # An all-skipped run exits 0, so the report must show passed tests.
      - name: PostgREST tests
        env:
          POSTGREST_URL: http://localhost:3000
        run: |
          npx vitest run --project postgrest --reporter=default --reporter=json --outputFile.json=postgrest-report.json
          node -e "const r = require('./postgrest-report.json'); if (!(r.numPassedTests > 0) || r.numFailedTests > 0) { console.error('PostgREST job: ' + r.numPassedTests + ' passed, ' + r.numFailedTests + ' failed'); process.exit(1); }"

  # The ruleset requires the check context `ci` (this job id); it always runs, so the jobs a fork PR skips fail it.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [checks, unit, browser, unit-compiled, browser-compiled, build, postgrest]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
