name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (typecheck, lint)
    runs-on: ubuntu-latest
    # PR runs gate on author (fork PRs skip, 0 min); to check an outside PR, Actions -> Run workflow on its branch.
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm types:check

      # Consumers run TypeScript 5.9, which infers some types differently from TypeScript 7.
      - name: Typecheck (TypeScript 5.9 consumer baseline)
        run: pnpm types:check:ts5

      - name: Lint (oxlint + import boundaries)
        run: pnpm lint

      - name: Typed lint (type-checked no-unsafe on registry source)
        run: pnpm lint:typed

  unit:
    name: Unit + coverage
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit + coverage (pure-lib branch thresholds enforced)
        run: npx vitest run registry --exclude "**/*.browser.test.*" --project unit --coverage

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Browser tests
        run: npx vitest run --project browser

  unit-compiled:
    name: Unit + React Compiler
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same suite with the React Compiler wired in; the guard tests fail if it is not.
      - name: Unit tests with the React Compiler
        run: npx vitest run --project unit-compiled

  browser-compiled:
    name: Browser + React Compiler
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Same suite with the React Compiler wired in; the guard tests fail if it is not.
      - name: Browser tests with the React Compiler
        run: npx vitest run --project browser-compiled

  build:
    name: Build + registry
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Before the rebuild — a rebuild would mask a committed payload that was never regenerated.
      - name: Verify payload content matches source
        run: node scripts/verify-payload-content.mjs

      - name: Registry build
        run: pnpm registry:build

      - name: Verify registry (no drift between registry.json and disk)
        run: node scripts/verify-registry.mjs

      - name: Verify demo install closure (dependencies and payload imports resolve)
        run: node scripts/verify-demo-install.mjs

      # Validates the GitHub registry (registry.json at repo root) exactly as the shadcn CLI
      # resolves it. GITHUB_TOKEN can read the repo that owns the workflow (per-shadcn-docs
      # limitation for other repos); the full commit SHA skips ref resolution via git.
      - name: Validate GitHub registry (shadcn CLI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx shadcn@latest registry validate DammersCode/gridcn#${{ github.sha }}

  # Aggregator the branch-protection ruleset requires under the name `ci`. Fails on ANY
  # non-success of a required job — a skipped job counts, so a manually-skipped step can never
  # smuggle a green check through. (The author gate above also skips this job itself on fork PRs.)
  # Job id (not a `name:` key) on purpose: the branch-protection ruleset requires a status check
  # named exactly `ci`, and a job's display name becomes the check context instead.
  ci:
    runs-on: ubuntu-latest
    needs: [checks, unit, browser, unit-compiled, browser-compiled, build]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login))
    steps:
      - name: Fail unless every required job succeeded
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
