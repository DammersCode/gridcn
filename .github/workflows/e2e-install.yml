name: E2E install

on:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      contains('["DammersCode"]', github.event.pull_request.user.login)
    steps:
      - uses: actions/checkout@v5
        with:
          # The default item set diffs against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry payloads
        run: pnpm registry:build

      # PR runs install the demos whose closure changed vs. main; scheduled/manual runs install all.
      - name: Run e2e install smoke test (default items)
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e-install

      - name: Run e2e install smoke test (all items)
        if: github.event_name != 'pull_request'
        run: node scripts/verify-e2e-install.mjs --all
